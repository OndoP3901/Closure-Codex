[package]
name = "closure-companion-tauri"
version = "0.11.0"
edition = "2021"
publish = false

[build-dependencies]
ico = "0.6"
tauri-build = "2"

[dependencies]
chrono = "0.4"
lewton = "0.10"
notify = { version = "8", default-features = false }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-single-instance = "2"
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "process", "io-util"] }
tungstenite = "0.28"
ureq = { version = "3", features = ["json"] }
url = "2"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[profile.release]
lto = "thin"
strip = "symbols"
